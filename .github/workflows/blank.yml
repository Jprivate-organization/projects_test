name: Run inline GraphQL query

on:
  workflow_dispatch:

jobs:
  run-graphql:
    runs-on: ubuntu-latest
    env:
      QUERY: |
        {
          repository(owner: "Junpei-000", name: "Jprivate-organization") {
            projectV2(number: 1) {
              title
            }
          }
        }
    steps:
      - name: Run GraphQL query
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          payload=$(jq -Rn --arg q "$QUERY" '{query: $q}')
          http_code=$(curl -s -o result.json -w "%{http_code}" \
            -H "Authorization: bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql -d "$payload")

          echo "HTTP status: $http_code"
          jq . result.json || cat result.json
      - name: Upload result.json
        uses: actions/upload-artifact@v4
        with:
          name: result-json
          path: result.json
