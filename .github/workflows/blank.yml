name: Get repository info

on:
  workflow_dispatch:

jobs:
  repo-info:
    runs-on: ubuntu-latest
    env:
      OWNER: "Jprivate-organization"
      REPO: "projects_test"
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Print repository info
        run: |
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "ERROR: token not provided. Set secrets.MY_PAT or ensure GITHUB_TOKEN is available."
            exit 1
          fi

          URL="https://api.github.com/repos/${OWNER}/${REPO}"
          echo "Requesting: $URL"
          http_code=$(curl -sS -H "Authorization: bearer $TOKEN" -H "Accept: application/vnd.github+json" -w "%{http_code}" -o repo.json "$URL")
          echo "HTTP status: $http_code"
          echo "---- raw JSON ----"
          cat repo.json || true
          echo "---- pretty JSON ----"
