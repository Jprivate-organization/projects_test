name: Get repository Projects (auto-detect V2)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/repo (例: Jprivate-organization/projects_test)'
        required: true
        default: 'Jprivate-organization/projects_test'

jobs:
  get-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Prepare token
        id: token
        run: |
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "ERROR: token not provided. Set secrets.MY_PAT or ensure GITHUB_TOKEN is available."
            exit 1
          fi
          echo "token_len=${#TOKEN}" >> $GITHUB_OUTPUT

      - name: Split owner/repo
        id: split
        run: |
          I="${{ github.event.inputs.repo }}"
          OWNER="${I%%/*}"
          REPO="${I##*/}"
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT

           - name: Query projectsV2 (GraphQL)
        id: query_v2
        run: |
          OWNER="${{ steps.split.outputs.owner }}"
          REPO="${{ steps.split.outputs.repo }}"
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi

          # 変数展開ありの heredoc（% による副作用なし）
          read -r -d '' QUERY <<GRAPHQL || true
          {
            repository(owner: "$OWNER", name: "$REPO") {
              projectsV2(first: 100) {
                nodes { id number title }
              }
            }
          }
GRAPHQL

          payload=$(jq -Rn --arg q "$QUERY" '{query: $q}')
          curl -s -H "Authorization: bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -X POST https://api.github.com/graphql -d "$payload" -o projectsv2.json

          echo "---- projectsV2 raw ----"
          cat projectsv2.json || true
          echo "---- projectsV2 pretty ----"
          jq . projectsv2.json || true

          cnt=$(jq -r '.data.repository.projectsV2.nodes // [] | length' projectsv2.json)
          echo "v2_count=$cnt" >> $GITHUB_OUTPUT

      - name: If projectsV2 found — fetch each project detail
        if: ${{ steps.query_v2.outputs.v2_count != '0' }}
        run: |
          OWNER="${{ steps.split.outputs.owner }}"
          REPO="${{ steps.split.outputs.repo }}"
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi

          # for ループで各 project number を取り出して heredoc でクエリ作成（printf を使わない）
          for num in $(jq -r '.data.repository.projectsV2.nodes[].number' projectsv2.json); do
            echo "Fetching projectV2 number: $num"
            read -r -d '' QUERY <<GRAPHQL || true
            {
              repository(owner: "$OWNER", name: "$REPO") {
                projectV2(number: $num) {
                  id
                  number
                  title
                  fields(first: 50) { nodes { ... on ProjectV2Field { name dataType } ... on ProjectV2SingleSelectField { name options { id name } } } }
                  items(first: 50) {
                    nodes {
                      id
                      content { __typename ... on Issue { number title state } ... on PullRequest { number title state } }
                    }
                  }
                }
              }
            }
GRAPHQL
            payload=$(jq -Rn --arg q "$QUERY" '{query: $q}')
            curl -s -H "Authorization: bearer $TOKEN" -H "Content-Type: application/json" \
              -X POST https://api.github.com/graphql -d "$payload" -o "project_${num}.json"
            echo "---- project ${num} ----"
            jq . "project_${num}.json" || cat "project_${num}.json"
          done

      - name: If no projectsV2 — list classic Projects via REST
        if: ${{ steps.query_v2.outputs.v2_count == '0' }}
        run: |
          OWNER="${{ steps.split.outputs.owner }}"
          REPO="${{ steps.split.outputs.repo }}"
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi

          URL="https://api.github.com/repos/${OWNER}/${REPO}/projects"
          echo "Requesting classic projects: $URL"
          curl -sS -H "Authorization: bearer $TOKEN" -H "Accept: application/vnd.github.inertia-preview+json" "$URL" -o classic_projects.json || true
          echo "---- classic projects raw ----"
          cat classic_projects.json || true
          echo "---- classic projects pretty ----"
          jq . classic_projects.json || echo "no classic projects or not allowed"
