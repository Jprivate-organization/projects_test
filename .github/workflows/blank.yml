name: Get ProjectsV2 info

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: '（任意）詳細を取得する projectV2 の number'
        required: false
        default: ''

jobs:
  projects-v2:
    runs-on: ubuntu-latest
    env:
      OWNER: "Jprivate-organization"
      REPO: "projects_test"
      LIST_QUERY: |
        {
          repository(owner: "Jprivate-organization", name: "projects_test") {
            projectsV2(first: 100) {
              nodes {
                id
                number
                title
              }
            }
          }
        }
      DETAIL_QUERY_TEMPLATE: |
        {
          repository(owner: "Jprivate-organization", name: "projects_test") {
            projectV2(number: %d) {
              id
              number
              title
              fields(first: 50) {
                nodes {
                  ... on ProjectV2Field { id name dataType }
                  ... on ProjectV2SingleSelectField { id name options { id name } }
                }
              }
              items(first: 100) {
                nodes {
                  id
                  content {
                    __typename
                    ... on Issue { title number state author { login } }
                    ... on PullRequest { title number state author { login } }
                  }
                }
              }
            }
          }
        }
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Prepare token
        run: |
          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          if [ -z "$TOKEN" ]; then
            echo "ERROR: token not provided. Set secrets.MY_PAT or ensure GITHUB_TOKEN is available."
            exit 1
          fi
          echo "::set-output name=token::$TOKEN"
        id: prepare

      - name: List ProjectsV2
        run: |
          TOKEN="${{ steps.prepare.outputs.token }}"
          payload=$(jq -Rn --arg q "$LIST_QUERY" '{query: $q}')
          curl -sS -H "Authorization: bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -X POST https://api.github.com/graphql -d "$payload" -o list.json
          echo "---- projects list (raw) ----"
          cat list.json || true
          echo "---- projects list (pretty) ----"
          jq . list.json || true

      - name: Get project detail (if provided)
        if: ${{ github.event.inputs.project_number != '' }}
        run: |
          TOKEN="${{ steps.prepare.outputs.token }}"
          NUM=${{ github.event.inputs.project_number }}
          QUERY=$(printf "$DETAIL_QUERY_TEMPLATE" "$NUM")
          payload=$(jq -Rn --arg q "$QUERY" '{query: $q}')
          curl -sS -H "Authorization: bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -X POST https://api.github.com/graphql -d "$payload" -o project.json
          echo "---- project detail (raw) ----"
          cat project.json || true
          echo "---- project detail (pretty) ----"
          jq . project.json || true
