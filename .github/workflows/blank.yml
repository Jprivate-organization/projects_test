name: Debug repo existence

on:
  workflow_dispatch:

jobs:
  check-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Check repo via REST and print result
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          http_code=$(curl -s -o repo.json -w "%{http_code}" \
            -H "Authorization: bearer $TOKEN" \
            https://github.com/Jprivate-organization/projects_test)

          echo "HTTP status: $http_code"
          echo "---- raw JSON ----"
          cat repo.json || true
          echo "---- pretty JSON ----"
          jq . repo.json || true
