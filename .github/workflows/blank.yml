name: Run GraphQL query (inline)

on:
  workflow_dispatch:

jobs:
  run-graphql:
    runs-on: ubuntu-latest
    env:
      QUERY: |
        {
          repository(owner: "Jprivate-organization", name: "projects_test") {
            projectV2(number: 1) {
              title
              fields(first: 1) {
                nodes {
                  ... on ProjectV2Field {
                    name
                    dataType
                  }
                  ... on ProjectV2SingleSelectField {
                    name
                    options {
                      name
                      id
                    }
                  }
                }
              }
              items(first: 5) {
                nodes {
                  content {
                    ... on Issue {
                      title
                      number
                      state
                      author {
                        login
                      }
                    }
                  }
                }
              }
            }
          }
        }
    steps:
      - name: Run GraphQL query and print result
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

          TOKEN="${{ secrets.MY_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          payload=$(jq -Rn --arg q "$QUERY" '{query: $q}')
          curl -s -H "Authorization: bearer $TOKEN" \
               -H "Content-Type: application/json" \
               -X POST https://api.github.com/graphql \
               -d "$payload" -o result.json

          echo "---- raw result ----"
          cat result.json || true
          echo "---- pretty JSON ----"
          jq . result.json || true
